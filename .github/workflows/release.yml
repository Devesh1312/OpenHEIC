name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache vcpkg (static libheif)
        uses: actions/cache@v4
        with:
          path: .deps/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('scripts/setup-deps.ps1') }}

      - name: Build native dependencies
        shell: pwsh
        run: ./scripts/setup-deps.ps1

      - name: Build and test
        run: |
          cargo build --release --workspace --lib --bins --examples
          cargo test --release --workspace

      - name: Package
        shell: pwsh
        run: |
          $name = "OpenHEIC-${{ github.ref_name }}-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/heic-convert.exe, target/release/heic_wic.dll $dir
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md $dir
          Copy-Item -Recurse licenses "$dir/licenses"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$name.zip"
          # LF line ending so `sha256sum -c` works on Linux/macOS too.
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/$name.zip.sha256", "$hash  $name.zip`n")

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
