name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache vcpkg (static libheif)
        uses: actions/cache@v4
        with:
          path: .deps/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('scripts/setup-deps.ps1') }}

      - name: Build native dependencies
        shell: pwsh
        run: ./scripts/setup-deps.ps1

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --lib --bins --examples

      - name: Test
        run: cargo test --release --workspace

      - name: WIC codec in-process smoke test
        run: target/release/examples/wic_probe.exe inproc crates/heic-core/tests/data/test.heic

      - name: Release binaries exist and run
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/heic_wic.dll)) { throw "heic_wic.dll missing" }
          ./target/release/heic-convert.exe --version
          ./target/release/heic-convert.exe convert crates/heic-core/tests/data --out "$env:RUNNER_TEMP/jpg"
          if ((Get-ChildItem "$env:RUNNER_TEMP/jpg" -Filter *.jpg).Count -lt 3) { throw "conversion produced too few JPEGs" }
