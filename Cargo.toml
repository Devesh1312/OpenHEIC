[workspace]
resolver = "2"
members = ["crates/heic-core", "crates/heic-convert", "crates/heic-wic"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devesh1312/OpenHEIC"
authors = ["Devesh1312 and OpenHEIC contributors"]
keywords = ["heic", "heif", "jpeg", "windows", "wic"]
categories = ["multimedia::images", "command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1
